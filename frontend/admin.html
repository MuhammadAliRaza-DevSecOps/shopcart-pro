<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - ShopCart Pro</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">ShopCart Pro</div>
    <nav class="nav" id="site-nav"></nav>
  </header>

  <section class="section">
    <h2>Admin Dashboard</h2>

    <div class="auth-card" style="max-width:100%;">
      <h3>Add Product</h3>
      <form id="adminProductForm" class="amazon-auth-form">
        <input type="text" id="productName" placeholder="Product name" required />
        <input type="number" id="productPrice" placeholder="Price" required />
        <input type="text" id="productCategory" placeholder="Category" required />
        <input type="number" step="0.1" id="productRating" placeholder="Rating" />
        <input type="number" id="productStock" placeholder="Stock" />
        <input type="text" id="productImage" placeholder="Image URL" required />
        <input type="text" id="productDescription" placeholder="Description" required />
        <input type="hidden" id="editProductId" />
        <button type="submit" class="amazon-btn" id="adminSubmitBtn">Add Product</button>
      </form>
      <p id="adminMessage" class="auth-message"></p>
    </div>

    <div class="section" style="padding-left:0;padding-right:0;">
      <h3>All Products</h3>
      <div id="admin-products-grid" class="product-grid"></div>
    </div>
  </section>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
