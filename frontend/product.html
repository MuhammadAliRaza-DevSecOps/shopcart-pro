<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — ShopCart Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="sp-cursor" id="spCursor"></div>
<div class="sp-cursor-ring" id="spCursorRing"></div>
<div id="sp-loader"><div class="loader-ring"></div><div class="loader-brand">ShopCart<span style="color:var(--gold)">Pro</span></div></div>
<div id="sp-toast-container"></div>

<header class="topbar" id="topbar">
  <a href="index.html" class="logo">ShopCart<span>Pro</span></a>
  <nav class="nav" id="site-nav"></nav>
  <button class="sp-hamburger" id="spHamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</header>

<div style="height:68px;"></div>

<div style="padding:16px 40px;border-bottom:1px solid var(--border);background:var(--bg-2);">
  <div style="max-width:1320px;margin:0 auto;font-size:0.78rem;color:var(--text-3);">
    <a href="index.html" style="color:var(--text-3);transition:color .2s;" onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--text-3)'">Home</a>
    <span style="margin:0 8px;">›</span>
    <a href="products.html" style="color:var(--text-3);transition:color .2s;" onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--text-3)'">Products</a>
    <span style="margin:0 8px;">›</span>
    <span>Detail</span>
  </div>
</div>

<section class="section">
  <!-- PRESERVED: exact ID product-detail that product-detail.js targets -->
  <div id="product-detail" class="product-detail"></div>
</section>

<footer>
  <div class="footer-bottom" style="max-width:1320px;margin:0 auto;padding:22px 40px;">
    <p>© 2026 ShopCart Pro. All rights reserved.</p>
    <div class="footer-trust">
      <span>🔒 SSL Secure</span><span>⚡ Fast</span><span>✅ Verified</span>
    </div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/navbar.js"></script>
<script src="js/sp-core.js"></script>
<script src="js/product-detail.js"></script>
</body>
</html>
