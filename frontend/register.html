<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — ShopCart Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">

<div class="sp-cursor" id="spCursor"></div>
<div class="sp-cursor-ring" id="spCursorRing"></div>
<div id="sp-toast-container"></div>
<div class="auth-orb auth-orb-1"></div>
<div class="auth-orb auth-orb-2"></div>

<div class="auth-wrapper">
  <a href="index.html" class="auth-logo">ShopCart<span>Pro</span></a>

  <div class="amazon-auth-card">
    <h1>Create account</h1>

    <!-- PRESERVED: exact form + IDs auth.js needs -->
    <form id="registerForm" class="amazon-auth-form">
      <label for="registerName">Your name</label>
      <input type="text" id="registerName" placeholder="First and last name" required autocomplete="name" />

      <label for="registerEmail">Email</label>
      <input type="email" id="registerEmail" placeholder="you@example.com" required autocomplete="email" />

      <label for="registerPassword">Password</label>
      <input type="password" id="registerPassword" placeholder="At least 6 characters" required autocomplete="new-password" />

      <button type="submit" class="amazon-btn">Create your account</button>
    </form>

    <!-- PRESERVED: exact ID registerMessage -->
    <p id="registerMessage" class="auth-message"></p>

    <p class="auth-small-text">
      By creating an account, you agree to ShopCart Pro's conditions of use and privacy notice.
      <br><span style="color:var(--text-3);font-size:0.7rem;">🔒 SSL secured · Data encrypted · Account protected</span>
    </p>
  </div>

  <div class="auth-divider"><span>Already have an account?</span></div>
  <a href="login.html" class="amazon-secondary-btn">Sign in to ShopCart Pro</a>
</div>

<script src="js/api.js"></script>
<script src="js/sp-core.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
