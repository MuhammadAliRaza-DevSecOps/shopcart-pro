<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — ShopCart Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="sp-cursor" id="spCursor"></div>
<div class="sp-cursor-ring" id="spCursorRing"></div>
<div id="sp-loader"><div class="loader-ring"></div><div class="loader-brand">ShopCart<span style="color:var(--gold)">Pro</span></div></div>
<div id="sp-toast-container"></div>

<header class="topbar" id="topbar">
  <a href="index.html" class="logo">ShopCart<span>Pro</span></a>
  <nav class="nav" id="site-nav"></nav>
  <button class="sp-hamburger" id="spHamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</header>

<div style="height:68px;"></div>

<div style="background:var(--bg-2);border-bottom:1px solid var(--border);padding:36px 40px 28px;">
  <div style="max-width:1320px;margin:0 auto;">
    <div class="section-label">Secure Checkout</div>
    <h1 style="font-family:'DM Serif Display',serif;font-size:clamp(1.8rem,3vw,2.5rem);margin-top:8px;">Checkout</h1>
  </div>
</div>

<section class="section" style="padding-top:48px;">
  <div style="max-width:1320px;margin:0 auto;">
    <!-- PRESERVED: exact class checkout-grid -->
    <div class="checkout-grid">

      <!-- PRESERVED: exact form ID checkoutForm and all field IDs -->
      <div class="auth-card">
        <h3>🚚 Shipping Information</h3>
        <form id="checkoutForm" class="amazon-auth-form">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Your full name" required autocomplete="name" />

          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="+92 3XX XXXXXXX" required autocomplete="tel" />

          <label for="city">City</label>
          <input type="text" id="city" placeholder="Your city" required autocomplete="address-level2" />

          <label for="address">Street Address</label>
          <input type="text" id="address" placeholder="House #, Street, Area" required autocomplete="street-address" />

          <button type="submit" class="amazon-btn">🔒 Place Order Securely</button>
        </form>

        <!-- PRESERVED: exact ID checkoutMessage -->
        <p id="checkoutMessage" class="auth-message"></p>
      </div>

      <!-- PRESERVED: exact IDs checkout-items and checkout-total -->
      <div class="cart-summary" style="position:sticky;top:90px;">
        <h3 style="font-size:1rem;font-weight:700;margin-bottom:0;">Order Summary</h3>
        <div style="border-bottom:1px solid var(--border);padding:16px 0;margin-bottom:16px;">
          <div id="checkout-items"></div>
        </div>
        <h3 id="checkout-total" style="font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--gold);">Total: PKR 0</h3>
        <div style="margin-top:16px;font-size:0.72rem;color:var(--text-3);display:flex;flex-direction:column;gap:6px;">
          <span>🔒 Payment is SSL encrypted</span>
          <span>📧 Confirmation sent by email</span>
          <span>↩️ 30-day return guarantee</span>
        </div>
      </div>

    </div>
  </div>
</section>

<footer>
  <div class="footer-bottom" style="max-width:1320px;margin:0 auto;padding:22px 40px;">
    <p>© 2026 ShopCart Pro. All rights reserved.</p>
    <div class="footer-trust"><span>🔒 SSL Secure</span><span>✅ Verified</span></div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/navbar.js"></script>
<script src="js/sp-core.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
