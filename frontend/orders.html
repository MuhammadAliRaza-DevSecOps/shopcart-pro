<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — ShopCart Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="sp-cursor" id="spCursor"></div>
<div class="sp-cursor-ring" id="spCursorRing"></div>
<div id="sp-loader"><div class="loader-ring"></div><div class="loader-brand">ShopCart<span style="color:var(--gold)">Pro</span></div></div>
<div id="sp-toast-container"></div>

<header class="topbar" id="topbar">
  <a href="index.html" class="logo">ShopCart<span>Pro</span></a>
  <nav class="nav" id="site-nav"></nav>
  <button class="sp-hamburger" id="spHamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</header>

<div style="height:68px;"></div>

<div style="background:var(--bg-2);border-bottom:1px solid var(--border);padding:36px 40px 28px;">
  <div style="max-width:1320px;margin:0 auto;">
    <div class="section-label">Account</div>
    <h1 style="font-family:'DM Serif Display',serif;font-size:clamp(1.8rem,3vw,2.5rem);margin-top:8px;">My Orders</h1>
  </div>
</div>

<section class="section" style="padding-top:48px;">
  <div style="max-width:1320px;margin:0 auto;">
    <!-- PRESERVED: exact ID orders-list that inline script targets -->
    <div id="orders-list" class="orders-grid">
      <div class="order-card">
        <div style="text-align:center;padding:32px 0;">
          <div class="loader-ring" style="margin:0 auto 16px;"></div>
          <p style="color:var(--text-2);">Loading your orders…</p>
        </div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-bottom" style="max-width:1320px;margin:0 auto;padding:22px 40px;">
    <p>© 2026 ShopCart Pro. All rights reserved.</p>
    <div class="footer-trust"><span>🔒 SSL Secure</span><span>✅ Verified</span></div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/navbar.js"></script>
<script src="js/sp-core.js"></script>

<!-- PRESERVED: exact inline order loading script, enhanced with premium HTML -->
<script>
async function loadOrdersInline() {
  var ordersList = document.getElementById("orders-list");
  var token = localStorage.getItem("token");

  if (!ordersList) return;

  if (!token) {
    ordersList.innerHTML =
      '<div class="order-card" style="text-align:center;padding:56px;">' +
        '<div style="font-size:3rem;margin-bottom:16px;">🔒</div>' +
        '<h3 style="font-family:\'DM Serif Display\',serif;margin-bottom:12px;">Sign in required</h3>' +
        '<p style="color:var(--text-2);margin-bottom:24px;">Please log in to view your order history.</p>' +
        '<a href="login.html" class="btn">Sign In →</a>' +
      '</div>';
    return;
  }

  try {
    var response = await fetch("http://localhost:5001/api/orders/my", {
      method: "GET",
      headers: { Authorization: "Bearer " + token }
    });

    var orders = await response.json();

    if (!response.ok) {
      ordersList.innerHTML =
        '<div class="order-card"><p style="color:var(--text-2);">' +
          (orders.message || "Failed to load orders.") +
        '</p></div>';
      return;
    }

    if (!Array.isArray(orders) || orders.length === 0) {
      ordersList.innerHTML =
        '<div class="order-card" style="text-align:center;padding:56px;">' +
          '<div style="font-size:3rem;margin-bottom:16px;">📦</div>' +
          '<h3 style="font-family:\'DM Serif Display\',serif;margin-bottom:12px;">No orders yet</h3>' +
          '<p style="color:var(--text-2);margin-bottom:24px;">You haven\'t placed any orders yet.</p>' +
          '<a href="products.html" class="btn">Start Shopping →</a>' +
        '</div>';
      return;
    }

    var html = "";

    orders.forEach(function (order) {
      var items    = Array.isArray(order.items) ? order.items : [];
      var shipping = order.shippingAddress || {};
      var status   = (order.status || "pending").toLowerCase();

      var itemsHtml = items.length
        ? items.map(function (item) {
            return (
              '<div class="order-item-row">' +
                '<span>' + (item.name || "Unnamed Item") + '</span>' +
                '<span>Qty: ' + (item.quantity || 1) + '</span>' +
                '<span>PKR ' + (item.price || 0) + '</span>' +
              '</div>'
            );
          }).join("")
        : '<p style="color:var(--text-3);font-size:0.82rem;">No items found.</p>';

      html +=
        '<div class="order-card reveal">' +
          '<div class="order-header">' +
            '<div>' +
              '<h3>Order</h3>' +
              '<div class="order-id">#' + (order._id || "N/A") + '</div>' +
            '</div>' +
            '<span class="order-status ' + status + '">' + (order.status || "Pending") + '</span>' +
          '</div>' +
          '<div class="order-meta">' +
            '<div class="order-meta-item"><strong>Date</strong><span>' + (order.createdAt ? new Date(order.createdAt).toLocaleDateString("en-PK", {year:"numeric",month:"short",day:"numeric"}) : "N/A") + '</span></div>' +
            '<div class="order-meta-item"><strong>Total</strong><span style="color:var(--gold);font-family:\'Bebas Neue\',sans-serif;font-size:1.2rem;">PKR ' + (order.totalAmount || 0) + '</span></div>' +
            '<div class="order-meta-item"><strong>Items</strong><span>' + items.length + ' item' + (items.length !== 1 ? 's' : '') + '</span></div>' +
          '</div>' +
          '<div class="order-section">' +
            '<h4>Shipping Address</h4>' +
            '<p style="color:var(--text-2);font-size:0.85rem;line-height:1.7;">' +
              (shipping.fullName || '-') + ' · ' +
              (shipping.phone    || '-') + '<br>' +
              (shipping.address  || '-') + ', ' +
              (shipping.city     || '-') +
            '</p>' +
          '</div>' +
          '<div class="order-section">' +
            '<h4>Items</h4>' +
            '<div class="order-items">' + itemsHtml + '</div>' +
          '</div>' +
        '</div>';
    });

    ordersList.innerHTML = html;

    // Trigger reveal
    if (window.IntersectionObserver) {
      var obs = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) e.target.classList.add('in'); });
      }, { threshold: 0.08 });
      ordersList.querySelectorAll('.reveal').forEach(function (el) { obs.observe(el); });
    }

  } catch (error) {
    ordersList.innerHTML =
      '<div class="order-card">' +
        '<p style="color:var(--text-2);">Something went wrong while loading orders. Please refresh.</p>' +
      '</div>';
  }
}

window.addEventListener("DOMContentLoaded", loadOrdersInline);
</script>
</body>
</html>
