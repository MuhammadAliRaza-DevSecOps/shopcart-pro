apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shopcart
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: "{{ .Values.backend.port }}"
            - name: MONGO_URI
              value: "mongodb://mongo-service:{{ .Values.mongo.port }}/shopcartpro"
            - name: JWT_SECRET
              value: "supersecretkey"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: shopcart
spec:
  selector:
    app: backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
